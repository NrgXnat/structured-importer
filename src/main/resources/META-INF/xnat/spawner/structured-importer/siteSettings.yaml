#########################################################
####  Root Site Admin Spawner Config Object          ####
####  Structured Importer — CSV Column Mappings       ####
#########################################################

siteSettings:
    kind: tabs
    name: structuredImporterAdminPage
    groups:
        structuredImporterTabGroup: Structured Importer
    contents:
        ${csvColumnMappingsTab}

####
#### Structured Importer Site Settings Panels
####

csvColumnMappingsTab:
    kind: tab
    name: csvColumnMappingsTab
    label: CSV Column Mappings
    group: structuredImporterTabGroup
    active: false
    contents:
        ${csvColumnMappingsPanel}
        ${csvColumnMappingsScript}

csvColumnMappingsPanel:
    kind: panel.form
    name: csvColumnMappingsPanel
    label: Site-wide CSV Column Mappings
    method: POST
    url: ~/xapi/structured-importer/csv-column-mappings
    contentType: json
    contents:
        columnMappingsHelp:
            tag: div|style=margin-bottom:8px;
            content: >
                <a href="#!" class="structured-importer-mappings-help" data-scope="site" title="About CSV column mappings">
                <i class="fa fa-question-circle" style="color: #084fab;"></i> About CSV column mappings</a>
        columnMappingsTable:
            tag: div#structured-importer-site-csv-table.structured-importer-mappings-table
        columnMappingsPreview:
            tag: div#structured-importer-site-csv-preview.structured-importer-mappings-preview
        columnMappings:
            tag: input#structured-importer-site-csv|type=hidden|name=columnMappings
        columnMappingsDescription:
            tag: div.description
            content: >
                This configuration applies to every project that does not define its own project-level mappings.
                Changes take effect when you click Save.

csvColumnMappingsScript:
    tag: script|src="~/scripts/xnat/plugin/structured-importer/csvColumnMappings.js"

# end
