####
#### Structured Importer Project Settings Panels
#### CSV Column Mappings (project-level override of the site-wide configuration)
####

projectSettings:
    kind: tabs
    name: structuredImporterProjectSettings
    groups:
        structuredImporterSettings: Structured Importer
    contents:
        ${csvColumnMappingsProjectTab}
        ${deviceMappingsProjectTab}

csvColumnMappingsProjectTab:
    kind: tab
    name: csvColumnMappingsProjectTab
    label: CSV Column Mappings
    group: structuredImporterSettings
    contents:
        ${csvColumnMappingsProjectPanel}
        ${csvColumnMappingsProjectManage}
        ${csvColumnMappingsProjectScript}

csvColumnMappingsProjectPanel:
    kind: panel.form
    id: structured-importer-csv-mappings-panel
    name: csvColumnMappingsProjectPanel
    label: Project CSV Column Mappings
    method: POST
    url: ~/xapi/structured-importer/projects/{{XNAT.data.projectId}}/csv-column-mappings
    contentType: json
    contents:
        columnMappingsHelp:
            tag: div|style=margin-bottom:8px;
            content: >
                <a href="#!" class="structured-importer-mappings-help" data-scope="project" title="About CSV column mappings">
                <i class="fa fa-question-circle" style="color: #084fab;"></i> About CSV column mappings</a>
        columnMappingsTable:
            tag: div#structured-importer-project-csv-table.structured-importer-mappings-table
        columnMappingsJson:
            tag: div#structured-importer-project-csv-json.structured-importer-mappings-json
        columnMappings:
            tag: input#structured-importer-project-csv|type=hidden|name=columnMappings
        columnMappingsDescription:
            tag: div.description
            content: >
                These mappings apply to CSV imports into this project only. Changes take effect when you click Save.
                Use Disable or Delete below to fall back to the site-wide configuration.

csvColumnMappingsProjectManage:
    kind: panel
    name: csvColumnMappingsProjectManage
    label: Revert to Site-wide Configuration
    contents:
        manageButtons:
            kind: panel.element
            label: Project Override
            contents:
                disableProjectMappings:
                    tag: "button#structured-importer-disable-project.btn.btn-sm|type=button"
                    content: Disable
                deleteProjectMappings:
                    tag: "button#structured-importer-delete-project.btn.btn-sm|type=button|style=margin-left:8px;"
                    content: Delete
                manageDescription:
                    tag: div.description
                    content: >
                        <b>Disable</b> temporarily turns off this project's mappings; they are retained and can be
                        restored by saving them again. <b>Delete</b> removes them. In either case, imports into this
                        project fall back to the site-wide configuration. (Project owners only.)

deviceMappingsProjectTab:
    kind: tab
    name: deviceMappingsProjectTab
    label: Device Mappings
    group: structuredImporterSettings
    contents:
        ${deviceMappingsProjectPanel}
        ${deviceMappingsProjectScript}

deviceMappingsProjectPanel:
    kind: panel
    name: deviceMappingsProjectPanel
    label: Project Device Mappings
    contents:
        deviceMappingsProjectIntro:
            tag: div.description
            content: >
                The devices uploads into this project can name. When an upload names a device, its CSV manifest is
                read with the device's mapping instead of the CSV column mappings. Site devices are listed with this
                project's own devices; <b>Customize</b> copies a site device into the project, and the copy replaces
                it for imports into this project. Deleting a project device requires project owner access.
        deviceMappingsProjectTable:
            tag: div#structured-importer-project-devices

# The ?v= query parameter busts browser caches; bump it whenever the script changes.
deviceMappingsProjectScript:
    tag: script|src="~/scripts/xnat/plugin/structured-importer/deviceMappings.js?v=1.0.0"

# The ?v= query parameter busts browser caches; bump it whenever the script changes.
csvColumnMappingsProjectScript:
    tag: script|src="~/scripts/xnat/plugin/structured-importer/csvColumnMappings.js?v=1.4.0"

#end
