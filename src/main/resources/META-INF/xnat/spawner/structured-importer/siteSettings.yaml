#########################################################
####  Root Site Admin Spawner Config Object          ####
####  Structured Importer — CSV Column Mappings       ####
#########################################################

siteSettings:
    kind: tabs
    name: structuredImporterAdminPage
    groups:
        structuredImporterTabGroup: Structured Importer
    contents:
        ${csvColumnMappingsTab}
        ${propertyDisplayMappingsTab}

####
#### Structured Importer Site Settings Panels
####

csvColumnMappingsTab:
    kind: tab
    name: csvColumnMappingsTab
    label: CSV Column Mappings
    group: structuredImporterTabGroup
    active: false
    contents:
        ${csvColumnMappingsPanel}
        ${csvColumnMappingsScript}

csvColumnMappingsPanel:
    kind: panel.form
    name: csvColumnMappingsPanel
    label: Site-wide CSV Column Mappings
    method: POST
    url: ~/xapi/structured-importer/csv-column-mappings
    contentType: json
    contents:
        columnMappingsHelp:
            tag: div|style=margin-bottom:8px;
            content: >
                <a href="#!" class="structured-importer-mappings-help" data-scope="site" title="About CSV column mappings">
                <i class="fa fa-question-circle" style="color: #084fab;"></i> About CSV column mappings</a>
        columnMappingsTable:
            tag: div#structured-importer-site-csv-table.structured-importer-mappings-table
        columnMappingsJson:
            tag: div#structured-importer-site-csv-json.structured-importer-mappings-json
        columnMappings:
            tag: input#structured-importer-site-csv|type=hidden|name=columnMappings
        columnMappingsDescription:
            tag: div.description
            content: >
                This configuration applies to every project that does not define its own project-level mappings.
                Changes take effect when you click Save.

propertyDisplayMappingsTab:
    kind: tab
    name: propertyDisplayMappingsTab
    label: Property Display Mappings
    group: structuredImporterTabGroup
    active: false
    contents:
        ${propertyDisplayMappingsPanel}

propertyDisplayMappingsPanel:
    kind: panel
    name: propertyDisplayMappingsPanel
    label: Property Display Mappings
    contents:
        propertyDisplayMappingsIntro:
            tag: div.description
            content: >
                These mappings associate the display values shown in the Property drop-down of the CSV column-mapping
                editors with XFT object properties. They are maintained site-wide: mappings added here or via the
                Custom&hellip; option in any column-mapping editor (including project settings) are available to all
                projects. Deleting a mapping does not change stored column mappings that reference its property.
        propertyDisplayMappingsTable:
            tag: div#structured-importer-display-mappings

# The ?v= query parameter busts browser caches; bump it whenever the script changes.
csvColumnMappingsScript:
    tag: script|src="~/scripts/xnat/plugin/structured-importer/csvColumnMappings.js?v=1.3.0"

# end
